<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <title>PDF → SVG</title>
  <link rel="stylesheet" href="fondo.css">
  <script defer src="pdf.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="converter" aria-label="Conversor de PDF a SVG">
    <button id="downloadAll" class="icon-button download-all" type="button" aria-label="Descargar todos los SVG listos" disabled>ALL ↓</button>
    <button id="addFiles" class="icon-button add-files" type="button" aria-label="Agregar PDF">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
    </button>
    <input id="fileInput" type="file" accept=".pdf,application/pdf" multiple hidden>
    <ul id="files" aria-label="Archivos"></ul>
    <span id="announcement" class="sr-only" role="status" aria-live="polite"></span>
  </main>
</body>
</html>

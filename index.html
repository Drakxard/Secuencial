<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esferas</title>
  <script>document.documentElement.classList.add('restoring-view');if('scrollRestoration'in history)history.scrollRestoration='manual'</script>
  <link rel="stylesheet" href="fondo.css">
</head>
<body>
  <div class="bg-blob blob-1" aria-hidden="true"></div>
  <div class="bg-blob blob-2" aria-hidden="true"></div>
  <div class="bg-blob blob-3" aria-hidden="true"></div>
  <main id="board" aria-label="Pizarra de esferas"></main>
  <nav id="categoryBar" class="category-bar" aria-label="Categorías" hidden>
    <div id="categoryList" class="category-list"></div>
    <button id="addCategory" class="add-category" type="button" title="Nueva categoría" aria-label="Nueva categoría">+</button>
  </nav>
  <div id="folderNotice" class="folder-notice" hidden>
    <section class="folder-card">
      <h1>Carpeta de almacenamiento</h1>
      <p>Elige una carpeta para guardar y recuperar tus esferas localmente.</p>
      <button id="chooseFolder" type="button">Elegir carpeta</button>
      <p id="folderError" class="error" role="alert"></p>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>

name: Android Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Verify release version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          GRADLE_VERSION="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle)"
          test "$VERSION" = "$PACKAGE_VERSION"
          test "$VERSION" = "$GRADLE_VERSION"
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - name: Restore signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SECUENCIAL_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/secuencial-release.jks"
      - name: Build signed APK
        working-directory: android
        env:
          SECUENCIAL_KEYSTORE_PATH: ${{ runner.temp }}/secuencial-release.jks
          SECUENCIAL_STORE_PASSWORD: ${{ secrets.SECUENCIAL_STORE_PASSWORD }}
          SECUENCIAL_KEY_ALIAS: ${{ secrets.SECUENCIAL_KEY_ALIAS }}
          SECUENCIAL_KEY_PASSWORD: ${{ secrets.SECUENCIAL_KEY_PASSWORD }}
        run: ./gradlew lintRelease assembleRelease
      - name: Prepare artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk Secuencial.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Secuencial.apk --title "Secuencial $GITHUB_REF_NAME" --generate-notes
